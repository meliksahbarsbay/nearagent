<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nearagent: erişilebilir kripto asistanı</title>
  <style>
    :root { color-scheme: light dark; --focus: #0050b3; }
    @media (prefers-color-scheme: dark) { :root { --focus: #8ab4ff; } }
    body { font: 1.125rem/1.5 system-ui, sans-serif; max-width: 34rem; margin: 0 auto; padding: 1rem; }
    label { display: block; margin-top: 1rem; margin-bottom: 0.5rem; font-weight: 600; }
    input, select, button { font: inherit; width: 100%; padding: 0.5rem; box-sizing: border-box; }
    button { margin-top: 1.25rem; font-weight: 600; }
    details { margin-top: 1.5rem; }
    summary { font-weight: 600; cursor: pointer; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    @media (forced-colors: active) { :focus-visible { outline-color: Highlight; } }
    #result { margin-top: 1.25rem; padding: 0.75rem; border: 2px solid currentColor; min-height: 3rem; }
    #ids { list-style: none; padding: 0; }
    #ids li { margin-top: 1rem; }
    #ids code { display: block; overflow-wrap: anywhere; font-size: 0.875rem; }
    #ids button { margin-top: 0.25rem; }
    #ids a { display: inline-block; margin-top: 0.5rem; padding: 0.5rem 0; }
    #language-row { margin-top: 1rem; }
    #mode-state { font-weight: 600; }
    #mode-state[data-live="true"] { padding: 0.5rem; border: 4px double currentColor; }
    #mic-state { font-weight: 600; }
    button[aria-disabled="true"] { border-style: dashed; cursor: progress; }
    #shortcuts { font-size: 0.875rem; }
    button[aria-pressed="true"] { border: 4px double currentColor; text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>nearagent</h1>
    <noscript><p>Bu sayfa JavaScript gerektirir. This page needs JavaScript.</p></noscript>
    <p id="intro"></p>
    <p id="mode-state" data-live="false"></p>
    <form id="ask-form" novalidate>
      <label for="sentence" id="sentence-label"></label>
      <input id="sentence" autocomplete="off" spellcheck="false" aria-describedby="shortcuts">
      <p id="shortcuts"></p>
      <button type="button" id="mic" aria-pressed="false"></button>
      <button type="button" id="voice-toggle" aria-pressed="false" aria-keyshortcuts="Alt+S"></button>
      <button type="submit" id="ask-submit"></button>
      <p id="mic-state" hidden></p>
      <button type="button" id="confirm" hidden></button>
    </form>

    <div id="language-row">
      <label for="lang" id="lang-label"></label>
      <select id="lang">
        <option value="tr" lang="tr">Türkçe</option>
        <option value="en" lang="en">English</option>
      </select>
    </div>

    <h2 id="result-heading"></h2>
    <div id="result" role="status" aria-live="polite" aria-atomic="true"></div>

    <section id="ids-section" aria-labelledby="ids-heading" hidden>
      <h2 id="ids-heading"></h2>
      <ul id="ids"></ul>
    </section>

    <details>
      <summary id="advanced-summary"></summary>
      <button type="button" id="live-toggle" aria-pressed="false"></button>
      <label for="stt" id="stt-label"></label>
      <select id="stt">
        <option value="browser" id="stt-browser"></option>
        <option value="near_ai" id="stt-near-ai"></option>
        <option value="openai" id="stt-openai"></option>
      </select>
      <p id="provider-state" aria-live="polite"></p>
      <form id="quote-form" novalidate>
        <label for="from-token" id="from-label"></label>
        <input id="from-token" autocomplete="off" spellcheck="false" value="NEAR">

        <label for="to-token" id="to-label"></label>
        <input id="to-token" autocomplete="off" spellcheck="false" value="USDC">

        <label for="amount" id="amount-label"></label>
        <input id="amount" inputmode="decimal" autocomplete="off" value="1">

        <button type="submit" id="submit"></button>
      </form>
    </details>
  </main>
  <script src="voice.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
